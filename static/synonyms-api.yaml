openapi: 3.1.0

info:
  title: Synonyms API
  version: 1.0.0
  contact:
    name: Synonyms API support
    url: https://dashboard.synonyms.io/support
  license:
    name: Proprietary
    url: https://dashboard.synonyms.io/terms
  description: |
    Manage synonym relationships for search and query expansion.

    Use this API to define how search terms relate to each other. You organize
    synonym entries into synonym sets, for example, one set per domain, and expand
    search queries with them at query time to improve search relevance,
    autocomplete, and query understanding.

    Typical use cases include:
    - Expanding user queries (for example, "laptop" → "notebook")
    - Normalizing vocabulary across domains
    - Managing controlled vocabularies or product taxonomies

servers:
  - url: https://api.synonyms.io/v1
    description: Production server

security:
  - bearerAuth: []

tags:
  - name: Synonyms
    x-displayName: Synonyms API reference
    description: This reference describes the base URL, versioning, request conventions, pagination, endpoints, errors, and rate limits of the Synonyms API.

paths:

  /synonyms:

    get:
      tags:
        - Synonyms
      summary: List synonym entries
      description: |
        Returns a paginated list of synonym entries. Use query parameters to filter
        the results. If you combine filters, an entry must match all of them.
      operationId: listSynonyms
      parameters:
        - name: synonym_set
          in: query
          description: Filters the results to entries in this synonym set.
          schema:
            $ref: '#/components/schemas/SynonymSetName'

        - name: tag
          in: query
          description: Filters the results to entries that include this tag. Matching is case-insensitive.
          schema:
            type: string
            examples:
              - furniture

        - name: synonym_type
          in: query
          description: Filters the results to entries with this relationship type.
          schema:
            $ref: '#/components/schemas/SynonymType'

        - name: term
          in: query
          description: Filters the results to entries whose `term` contains this value. Matching is partial and case-insensitive.
          schema:
            type: string
            examples:
              - sofa

        - name: page
          in: query
          description: The page number to return.
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: page_size
          in: query
          description: The number of entries to return per page. The maximum is 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: The response contains a page of synonym entries and pagination details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynonymList'
              example:
                data:
                  - id: syn_01hx4k9mzqe8f3b7n2p6r0wc5t
                    synonym_set: ecommerce
                    term: sofa
                    synonyms:
                      - couch
                      - settee
                      - divan
                    synonym_type: EQUIVALENT
                    tags:
                      - furniture
                    created_at: '2025-03-15T10:22:00Z'
                    updated_at: '2025-03-15T10:22:00Z'
                pagination:
                  page: 1
                  page_size: 20
                  total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Synonyms
      summary: Create a synonym entry
      description: |
        Creates a new synonym entry in a synonym set. The `term` must be unique within
        the set, regardless of case: if the set already has an entry with the same
        `term`, the API returns `409 Conflict`. If a field breaks a limit, for example,
        `synonyms` is empty or has more than 50 items, the API returns
        `422 Unprocessable Entity`.
      operationId: createSynonym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynonymInput'
            example:
              synonym_set: ecommerce
              term: sofa
              synonyms:
                - couch
                - settee
                - divan
              synonym_type: EQUIVALENT
              tags:
                - furniture
      responses:
        '201':
          description: The synonym entry was created. The response contains the new entry.
          headers:
            Location:
              description: The URL of the new synonym entry.
              schema:
                type: string
                format: uri
              example: https://api.synonyms.io/v1/synonyms/syn_01hx4k9mzqe8f3b7n2p6r0wc5t
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Synonym'
              example:
                id: syn_01hx4k9mzqe8f3b7n2p6r0wc5t
                synonym_set: ecommerce
                term: sofa
                synonyms:
                  - couch
                  - settee
                  - divan
                synonym_type: EQUIVALENT
                tags:
                  - furniture
                created_at: '2025-03-15T10:22:00Z'
                updated_at: '2025-03-15T10:22:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /synonyms/{id}:

    parameters:
      - $ref: '#/components/parameters/SynonymId'

    get:
      tags:
        - Synonyms
      summary: Get a synonym entry
      description: Returns a synonym entry by ID.
      operationId: getSynonym
      responses:
        '200':
          description: The response contains the requested synonym entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Synonym'
              example:
                id: syn_01hx4k9mzqe8f3b7n2p6r0wc5t
                synonym_set: ecommerce
                term: sofa
                synonyms:
                  - couch
                  - settee
                  - divan
                synonym_type: EQUIVALENT
                tags:
                  - furniture
                created_at: '2025-03-15T10:22:00Z'
                updated_at: '2025-03-15T10:22:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Synonyms
      summary: Update a synonym entry
      description: |
        Replaces a synonym entry with the request body. Send every field that you want
        to keep: fields that you leave out reset to their defaults. The entry keeps its
        `id` and `created_at` values, and `updated_at` changes to the time of the update.

        The `term` must stay unique within the synonym set, regardless of case. If
        another entry in the set already has the new `term`, the API returns
        `409 Conflict`.
      operationId: updateSynonym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynonymInput'
            example:
              synonym_set: ecommerce
              term: sofa
              synonyms:
                - couch
                - settee
                - divan
                - chesterfield
              synonym_type: EQUIVALENT
              tags:
                - furniture
      responses:
        '200':
          description: The synonym entry was updated. The response contains the updated entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Synonym'
              example:
                id: syn_01hx4k9mzqe8f3b7n2p6r0wc5t
                synonym_set: ecommerce
                term: sofa
                synonyms:
                  - couch
                  - settee
                  - divan
                  - chesterfield
                synonym_type: EQUIVALENT
                tags:
                  - furniture
                created_at: '2025-03-15T10:22:00Z'
                updated_at: '2025-03-16T09:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Synonyms
      summary: Delete a synonym entry
      description: Permanently deletes a synonym entry by ID. You can't restore a deleted entry.
      operationId: deleteSynonym
      responses:
        '204':
          description: The synonym entry was deleted. The response has no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /expansions:

    get:
      tags:
        - Synonyms
      summary: Expand a search query
      description: |
        Returns the terms that a search for `q` should also match, based on the
        entries in a synonym set. Call this endpoint at query time, then send all
        returned terms to your search engine.

        The API compares `q` to terms and synonyms as whole values, regardless of
        case. Each matching entry adds terms according to its relationship type:

        - `EQUIVALENT`: if `q` is the `term` or one of the synonyms, the response
          includes the `term` and all synonyms.
        - `ONE_WAY`: if `q` is the `term`, the response includes all synonyms. If `q`
          is only a synonym, the entry adds nothing.
        - `GROUP`: if `q` is one of the synonyms, the response includes all synonyms.
          The `term` never matches.

        If several entries match, the response combines their terms without
        duplicates. Expansion doesn't chain: terms that one entry adds don't match
        other entries. If no entry matches, `terms` contains only `q`.
      operationId: expandQuery
      parameters:
        - name: q
          in: query
          required: true
          description: The search term to expand.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            examples:
              - couch
        - name: synonym_set
          in: query
          description: The synonym set to use for the expansion.
          schema:
            $ref: '#/components/schemas/SynonymSetName'
      responses:
        '200':
          description: The response contains the search term and the terms that it expands to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expansion'
              example:
                q: couch
                synonym_set: ecommerce
                terms:
                  - couch
                  - sofa
                  - settee
                  - divan
                matched_entries:
                  - syn_01hx4k9mzqe8f3b7n2p6r0wc5t
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Send an API key or access token in the `Authorization` header of every request:

        ```http
        Authorization: Bearer YOUR_ACCESS_TOKEN
        ```

        You can generate a long-lived API key in the developer dashboard, or request
        a short-lived access token from `POST /auth/token`. The token endpoint is described
        in the Authentication guide, not in this specification.

  parameters:
    SynonymId:
      name: id
      in: path
      required: true
      description: The ID of the synonym entry.
      schema:
        type: string
        pattern: '^syn_[0-9a-hjkmnp-tv-z]{26}$'
        examples:
          - syn_01hx4k9mzqe8f3b7n2p6r0wc5t

  schemas:

    SynonymType:
      type: string
      minLength: 1
      examples:
        - EQUIVALENT
      enum:
        - EQUIVALENT
        - ONE_WAY
        - GROUP
      description: |
        The relationship type, which controls which terms match each other in a search.

        - `EQUIVALENT`: the `term` and all its synonyms match each other.
        - `ONE_WAY`: the `term` matches its synonyms, but the synonyms don't match the
          `term`. For example, a search for "laptop" finds "notebook," but a search for
          "notebook" doesn't find "laptop."
        - `GROUP`: the synonyms match each other. The `term` is only a name for the
          group and isn't used for matching.

    SynonymSetName:
      type: string
      pattern: '^[a-z0-9-]{1,50}$'
      minLength: 1
      maxLength: 50
      default: default
      description: |
        The name of a synonym set. A synonym set groups entries, for example, by domain.
        Terms must be unique within a set, so different sets can define the same term
        differently. The API creates a set when you add its first entry. If you don't
        specify a set, the API uses the `default` set.
      examples:
        - ecommerce

    SynonymInput:
      type: object
      required:
        - term
        - synonyms
        - synonym_type
      properties:
        synonym_set:
          $ref: '#/components/schemas/SynonymSetName'
        term:
          type: string
          minLength: 1
          maxLength: 100
          description: The primary term. Must be unique within the synonym set, regardless of case.
          examples:
            - sofa
        synonyms:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: The terms that relate to the primary term. Must contain 1 to 50 items.
        synonym_type:
          $ref: '#/components/schemas/SynonymType'
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 50
          description: Labels that categorize the entry within its synonym set. You can filter entries by tag. Can contain up to 10 tags.
          default: []

    Synonym:
      type: object
      required:
        - id
        - synonym_set
        - term
        - synonyms
        - synonym_type
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          readOnly: true
          pattern: '^syn_[0-9a-hjkmnp-tv-z]{26}$'
          minLength: 30
          maxLength: 30
          description: The ID of the synonym entry. The API generates it as `syn_` followed by a 26-character ULID.
          examples:
            - syn_01hx4k9mzqe8f3b7n2p6r0wc5t
        synonym_set:
          $ref: '#/components/schemas/SynonymSetName'
        term:
          type: string
          minLength: 1
          description: The primary term.
          examples:
            - sofa
        synonyms:
          type: array
          items:
            type: string
          description: The terms that relate to the primary term.
        synonym_type:
          $ref: '#/components/schemas/SynonymType'
        tags:
          type: array
          items:
            type: string
          description: Labels that categorize the entry.
        created_at:
          type: string
          format: date-time
          readOnly: true
          minLength: 1
          description: The time when the entry was created, in UTC.
          examples:
            - '2025-03-15T10:22:00Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          minLength: 1
          description: The time when the entry was last updated, in UTC.
          examples:
            - '2025-03-15T10:22:00Z'

    SynonymList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Synonym'
          description: The synonym entries on this page.
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required:
        - page
        - page_size
        - total
      properties:
        page:
          type: integer
          description: The current page number.
          examples:
            - 1
        page_size:
          type: integer
          description: The maximum number of entries per page.
          examples:
            - 20
        total:
          type: integer
          description: The total number of entries that match the filters, across all pages.
          examples:
            - 1

    Expansion:
      type: object
      required:
        - q
        - synonym_set
        - terms
        - matched_entries
      properties:
        q:
          type: string
          minLength: 1
          description: The search term from the request.
          examples:
            - couch
        synonym_set:
          $ref: '#/components/schemas/SynonymSetName'
        terms:
          type: array
          minItems: 1
          items:
            type: string
          description: The terms to search for. The first item is always `q`.
        matched_entries:
          type: array
          items:
            type: string
          description: The IDs of the entries that matched `q`. Empty if no entry matched.

    ProblemDetails:
      type: object
      description: |
        An error response in the Problem Details format defined by
        [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457). The API sends it with
        the `application/problem+json` media type.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          minLength: 1
          description: |
            Identifies the problem type. Compare this value to decide how to handle
            the error. Each type has a fixed `title`.
          enum:
            - https://api.synonyms.io/problems/invalid-request
            - https://api.synonyms.io/problems/unauthorized
            - https://api.synonyms.io/problems/forbidden
            - https://api.synonyms.io/problems/not-found
            - https://api.synonyms.io/problems/conflict
            - https://api.synonyms.io/problems/validation-failed
            - https://api.synonyms.io/problems/rate-limited
            - https://api.synonyms.io/problems/internal-error
          examples:
            - https://api.synonyms.io/problems/validation-failed
        title:
          type: string
          minLength: 1
          description: A short summary of the problem type.
          examples:
            - Validation failed
        status:
          type: integer
          description: The HTTP status code of the response.
          examples:
            - 422
        detail:
          type: string
          minLength: 1
          description: A human-readable explanation of this occurrence of the problem.
          examples:
            - The synonyms field must contain at least one item.
        instance:
          type: string
          format: uri-reference
          description: The path of the request that caused the problem.
          examples:
            - /v1/synonyms
        errors:
          type: array
          description: The fields that failed validation. Only validation problems include this field.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required:
        - field
        - detail
      properties:
        field:
          type: string
          minLength: 1
          description: The name of the field that failed validation.
          examples:
            - synonyms
        detail:
          type: string
          minLength: 1
          description: The reason that the field failed validation.
          examples:
            - Must contain at least one item.

  responses:

    BadRequest:
      description: The request is malformed, for example, it has invalid JSON or an unknown query parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.synonyms.io/problems/invalid-request
            title: Invalid request
            status: 400
            detail: The request body is not valid JSON.
            instance: /v1/synonyms

    Unauthorized:
      description: The API key or access token is missing, malformed, or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.synonyms.io/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: The access token has expired.
            instance: /v1/synonyms

    Forbidden:
      description: The API key or access token is valid but doesn't have permission for the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.synonyms.io/problems/forbidden
            title: Forbidden
            status: 403
            detail: This API key has read-only access.
            instance: /v1/synonyms

    NotFound:
      description: The synonym entry doesn't exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.synonyms.io/problems/not-found
            title: Not found
            status: 404
            detail: No synonym entry has the ID syn_01hx4k9mzqe8f3b7n2p6r0wc5t.
            instance: /v1/synonyms/syn_01hx4k9mzqe8f3b7n2p6r0wc5t

    Conflict:
      description: Another entry in the same synonym set already has this `term`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.synonyms.io/problems/conflict
            title: Conflict
            status: 409
            detail: The synonym set "ecommerce" already has an entry for the term "sofa".
            instance: /v1/synonyms

    UnprocessableEntity:
      description: The request is well-formed but fails validation, for example, a field is empty or too long.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.synonyms.io/problems/validation-failed
            title: Validation failed
            status: 422
            detail: The synonyms field must contain at least one item.
            instance: /v1/synonyms
            errors:
              - field: synonyms
                detail: Must contain at least one item.

    RateLimited:
      description: The client exceeded the rate limit of 100 requests per minute. Wait for the number of seconds in `Retry-After` before you retry.
      headers:
        Retry-After:
          description: The number of seconds to wait before you retry.
          schema:
            type: integer
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.synonyms.io/problems/rate-limited
            title: Too many requests
            status: 429
            detail: The rate limit of 100 requests per minute was exceeded. Retry after 30 seconds.
            instance: /v1/synonyms

    InternalServerError:
      description: The server encountered an unexpected error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.synonyms.io/problems/internal-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred. Try again later.
            instance: /v1/synonyms

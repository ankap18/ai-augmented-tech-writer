# Where Vale keeps its styles. Downloaded packages land here too.
StylesPath = .github/styles

# Only show warnings and errors. "suggestion" level is very noisy
# on a first run. Lower this to "suggestion" once you're comfortable.
MinAlertLevel = warning

# Download these style packages when "vale sync" runs.
# Google = the Google developer documentation style guide.
Packages = Google

# Your own list of accepted words (product names, jargon).
# Lives in .github/styles/config/vocabularies/Docs/accept.txt
Vocab = Docs

# Apply these settings to Markdown and MDX files.
[*.{md,mdx}]
# "Vale" = the built-in spell checker.
# "Google" = the Google style rules.
BasedOnStyles = Vale, Google

# Docusaurus-specific: turn off rules that don't fit your site.
# The format is Style.RuleName = NO. Example (uncomment if it annoys you):
# Google.Headings = NO

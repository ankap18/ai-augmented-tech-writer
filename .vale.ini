# Where Vale keeps its styles. Downloaded packages land here too.
StylesPath = .github/styles

# Only show warnings and errors. "suggestion" level is very noisy
# on a first run. Lower this to "suggestion" once you're comfortable.
MinAlertLevel = warning

# Download these style packages when "vale sync" runs.
# Google = the Google developer documentation style guide.
Packages = Google

# Your own list of accepted words (product names, jargon).
# Lives in .github/styles/config/vocabularies/Docs/accept.txt
Vocab = Docs

# Apply these settings to Markdown and MDX files.
[*.{md,mdx}]
# "Vale" = the built-in spell checker.
# "Google" = the Google style rules.
# "Personal" = my own rules, in .github/styles/Personal.
BasedOnStyles = Vale, Google, Personal

# Docusaurus-specific: turn off rules that don't fit your site.
# The format is Style.RuleName = NO.
# This is a personal site, so first person (I, me, my, we, our) is allowed.
Google.FirstPerson = NO
Google.We = NO
# Allow spaced em dashes (word — word).
Google.EmDash = NO

# Writing samples follow the Google style strictly: turn those rules back on.
[docs/portfolio/{vector-search,api-docs}/**]
Google.FirstPerson = YES
Google.We = YES
Google.EmDash = YES
Personal.ListSeparator = NO

# Skip content I didn't write: Docusaurus samples and generated API pages.
# An empty BasedOnStyles turns off every style for matching files.
[{blog/_docusaurus-examples,docs/tutorial-basics,docs/tutorial-extras,docs/portfolio/api-docs/generated}/**]
BasedOnStyles =
